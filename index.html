<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Metadata -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#121827" />
    <title>
      Healix AI | Next-Gen AI-Powered Intelligent Healthcare & Clinical Operations Dashboard
    </title>

    <!-- Primary SEO Metadata -->
    <meta
      name="description"
      content="Aether Health is a premium, production-ready intelligent clinical operations control center and healthcare analytics dashboard UI. Built with Vue 3, TypeScript, and Tailwind CSS, featuring real-time vitals tracking, predictive diagnosis modeling, bed allocations, and medical operational insights."
    />
    <meta
      name="keywords"
      content="AI healthcare dashboard, clinical operations, medical data analytics, smart hospital, electronic health records, Vue 3 dashboard, telemedicine portal, predictive medical modeling, patient monitoring"
    />
    <meta name="author" content="Mochrks" />
    <meta name="rating" content="General" />
    <meta name="distribution" content="Global" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://web-dashboard-healthcare.vercel.app/" />
    <meta property="og:site_name" content="Aether Health Operations Dashboard" />
    <meta
      property="og:title"
      content="Aether Health | Intelligent Healthcare & Clinical Operations Dashboard"
    />
    <meta
      property="og:description"
      content="Unlock advanced real-time medical status tracking, predictive risk modeling, staff resource scheduling, and operational telemetry. Built as a futuristic enterprise medical IoT control center."
    />
    <meta property="og:image" content="https://web-dashboard-healthcare.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Aether Health Healthcare and Smart Operations Control Center Interface Graphic"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://web-dashboard-healthcare.vercel.app/" />
    <meta
      name="twitter:title"
      content="Aether Health | Intelligent Healthcare & Clinical Operations Dashboard"
    />
    <meta
      name="twitter:description"
      content="Unlock advanced real-time medical status tracking, predictive risk modeling, staff resource scheduling, and operational telemetry. Built as a futuristic enterprise medical IoT control center."
    />
    <meta name="twitter:image" content="https://web-dashboard-healthcare.vercel.app/og-image.png" />
    <meta name="twitter:creator" content="@mochrks" />

    <!-- Icons & Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Preconnect / Font Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Canonical Link -->
    <link rel="canonical" href="https://web-dashboard-healthcare.vercel.app/" />

    <!-- Structured Data (JSON-LD WebApplication) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Aether Health",
        "url": "https://web-dashboard-healthcare.vercel.app/",
        "image": "https://web-dashboard-healthcare.vercel.app/og-image.png",
        "description": "Premium, production-quality AI healthcare operations and clinical metrics analytics control center, featuring intelligent diagnostics, real-time telemetry, bed allocation, and pharmacy logistics widgets.",
        "applicationCategory": "MedicalBusinessApplication, BusinessApplication",
        "operatingSystem": "All",
        "author": {
          "@type": "Person",
          "name": "Mochrks",
          "url": "https://github.com/mochrks"
        },
        "offers": {
          "@type": "Offer",
          "price": "0.00",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Anti-flash inline style based on system/saved theme -->
    <script>
      ;(function () {
        const savedTheme = localStorage.getItem('theme') || 'dark'
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark')
          document.documentElement.style.backgroundColor = '#0b0f19'
        } else {
          document.documentElement.classList.remove('dark')
          document.documentElement.style.backgroundColor = '#ffffff'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
